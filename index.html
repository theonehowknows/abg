<!doctype html>

    <!-- Suppress benign WebSocket/HMR disconnect errors in sandbox preview iframe -->
    <script>
      (function() {
        // Suppress unhandled errors and promise rejections for WebSocket
        var suppress = function(e) {
          var msg = (e && (e.message || (e.reason && (e.reason.message || e.reason)))) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('wsToken') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('SendBeforeConnectError') !== -1 || msg.indexOf('send was called before connect') !== -1)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        };
        window.addEventListener('error', suppress, true);
        window.addEventListener('unhandledrejection', suppress, true);

        // Safe mock WebSocket for Vite HMR in cloud preview iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          var MockWebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (protocols) {
              if (Array.isArray(protocols)) {
                isViteHmr = protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1;
              } else if (typeof protocols === 'string') {
                isViteHmr = protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1;
              }
            }
            if (typeof url === 'string' && (url.indexOf('24678') !== -1 || url.indexOf('vite-hmr') !== -1 || isViteHmr)) {
              var listeners = {};
              var ws = {
                url: url,
                readyState: 1, // WebSocket.OPEN
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { fn.call(ws, new Event('open')); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              setTimeout(function() {
                if (typeof ws.onopen === 'function') {
                  try { ws.onopen(new Event('open')); } catch(err) {}
                }
              }, 0);
              return ws;
            }
            return new RealWebSocket(url, protocols);
          };
          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;
          MockWebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket = MockWebSocket;
        }
      })();
    </script>
